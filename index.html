<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校長行政會議電子簽到系統</title>
    
    <!-- 引入 Firebase App (核心) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <!-- 引入 Firebase Realtime Database (即時資料庫) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <!-- 引入 QRCode 自動產生套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* 基礎重置與字體 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "微軟正黑體", sans-serif; }
        body {
            background: linear-gradient(135deg, #e0f2f1, #b2dfdb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        /* Glassmorphism 玻璃擬真容器 */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
        }

        /* 頁面切換設定 */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { color: #004d40; margin-bottom: 25px; font-size: 28px; }
        h2 { color: #00695c; margin-bottom: 20px; }

        /* 按鈕共用樣式 */
        .btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 15px;
            border: none; border-radius: 12px; font-size: 20px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: #00796b; color: white; }
        .btn-primary:hover { background: #004d40; }
        .btn-secondary { background: #eceff1; color: #455a64; }
        .btn-secondary:hover { background: #cfd8dc; }

        /* 名單列表網格與按鈕 */
        .name-grid {
            display: grid; grid-template-columns: 1fr; gap: 10px;
            max-height: 60vh; overflow-y: auto; margin-bottom: 20px;
            padding-right: 5px;
        }
        .btn-list {
            background: white; border: 2px solid #00796b; color: #00796b;
            padding: 12px; border-radius: 10px; font-size: 18px;
            text-align: left; cursor: pointer; transition: 0.2s;
        }
        .btn-list:hover { background: #e0f2f1; }
        
        /* 已簽到者的按鈕樣式 */
        .btn-list.signed {
            opacity: 0.5; background: #eeeeee; border-color: #9e9e9e; color: #757575;
            cursor: not-allowed;
        }

        /* 簽名區塊樣式 (修正深綠色姓名) */
        .info-display { font-size: 20px; margin-bottom: 15px; }
        .info-display span { 
            color: #2E7D32; /* 深綠色，華人忌諱紅字 */
            font-size: 32px; 
            font-weight: bold; 
            display: block; 
            margin-top: 5px; 
        } 
        
        .canvas-container {
            border: 2px dashed #00796b; border-radius: 10px; background: white;
            margin-bottom: 15px; touch-action: none;
        }
        canvas { width: 100%; height: 250px; border-radius: 10px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-group .btn { margin-bottom: 0; }

        /* 首頁 QR Code 區塊 */
        .qr-wrapper {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px dashed #b2dfdb;
        }
        .qr-text { font-size: 16px; color: #00796b; font-weight: bold; }
        #qrcode {
            padding: 10px; background: white; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 畫面一：首頁 -->
    <div id="screen-home" class="screen active">
        <h1 id="admin-trigger">行政會議電子簽到</h1>
        <button class="btn btn-primary" onclick="loadList('gov')">🏛️ 縣府長官 / 貴賓</button>
        <button class="btn btn-primary" onclick="loadList('school')">🏫 各級學校校長</button>
        <button class="btn btn-secondary" onclick="alert('簽退時間尚未開放！')">👋 離開簽退</button>

        <!-- 首頁下方的 QRCode -->
        <div class="qr-wrapper">
            <div class="qr-text">手機掃描，免網址直接簽到</div>
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- 畫面三：名單列表 -->
    <div id="screen-name-list" class="screen">
        <h2 id="list-title">名單讀取中...</h2>
        <div class="name-grid" id="name-list-container"></div>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">回首頁</button>
    </div>

    <!-- 畫面四：簽名頁面 -->
    <div id="screen-signature" class="screen">
        <h2>請在下方空白處簽名</h2>
        <div class="info-display">
            歡迎
            <span id="current-name"></span>
        </div>
        <div class="canvas-container">
            <canvas id="signature-pad"></canvas>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="clearCanvas()">清除重寫</button>
            <button class="btn btn-primary" onclick="submitSignature()">確認送出</button>
        </div>
        <button class="btn btn-secondary" style="margin-top: 15px;" onclick="showScreen('screen-name-list')">重新選擇姓名</button>
    </div>

    <!-- 畫面五：完成頁面 -->
    <div id="screen-success" class="screen">
        <h1 style="font-size: 40px; margin-top: 20px;">✅</h1>
        <h1>簽到成功！</h1>
        <p>資料已安全上傳雲端，請入座準備開會。</p>
    </div>
</div>

<script>
    // ==========================================
    // 1. Firebase 初始化
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyAN8iTR4KcypNai1n-Bxrc4MzYKUX5tirg",
        authDomain: "principal-5fe83.firebaseapp.com",
        projectId: "principal-5fe83",
        storageBucket: "principal-5fe83.firebasestorage.app",
        messagingSenderId: "692875653960",
        appId: "1:692875653960:web:1aedd061f2f6df4a9c797d",
        measurementId: "G-467L08S83Q",
        databaseURL: "https://principal-5fe83-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const DB_PATH = 'Principal_Meeting_2026';

    // ==========================================
    // 2. 變數與 Google Sheets CSV 網址
    // ==========================================
    let signedNames = []; 
    let currentPerson = null;
    let idleTimer; 
    
    // 將你提供的 CSV 網址綁定
    const CSV_URL_GOV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvK7PuLJ3dWq8WBY2-WP6sDrTl1II7cKDQoAVmBpi9pDvJ1mlQxXeyd2znvniPQ0Aqc2qhlUaNuKZO/pub?gid=1682828826&single=true&output=csv"; 
    const CSV_URL_SCHOOL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRvK7PuLJ3dWq8WBY2-WP6sDrTl1II7cKDQoAVmBpi9pDvJ1mlQxXeyd2znvniPQ0Aqc2qhlUaNuKZO/pub?gid=1933178382&single=true&output=csv"; 

    window.onload = () => {
        generateQRCode(); 
        listenToSignedData(); 
    };

    function generateQRCode() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        const currentURL = window.location.href.split('?')[0];
        new QRCode(qrContainer, {
            text: currentURL,
            width: 150,
            height: 150,
            colorDark : "#004d40", 
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.L
        });
    }

    // ==========================================
    // 3. Firebase 即時監聽與狀態判斷
    // ==========================================
    function listenToSignedData() {
        database.ref(DB_PATH).on('value', (snapshot) => {
            signedNames = [];
            snapshot.forEach((child) => {
                const data = child.val();
                signedNames.push(`${data.school}-${data.name}`);
            });
        });
    }

    function isAlreadySigned(person) {
        return signedNames.includes(`${person.school || '縣府長官'}-${person.name}`);
    }

    // ==========================================
    // 4. 畫面切換與閒置自動返回
    // ==========================================
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        clearTimeout(idleTimer);
        if (screenId === 'screen-signature') {
            initCanvas();
            resetIdleTimer(60); 
        } else if (screenId === 'screen-name-list') {
            resetIdleTimer(45); 
        }
    }

    function resetIdleTimer(seconds) {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            showScreen('screen-home');
        }, seconds * 1000);
    }

    // ==========================================
    // 5. 抓取 CSV 與名單渲染 (加入排序)
    // ==========================================
    async function fetchCSV(url) {
        try {
            const response = await fetch(url);
            const text = await response.text();
            // 切割換行，並過濾掉空白行
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            const result = [];
            
            // 假設第一行是標題(學校,職稱,姓名)，從第二行開始抓 (i=1)
            for (let i = 1; i < lines.length; i++) {
                // 清除可能存在的雙引號與多餘空白
                const cols = lines[i].split(',').map(col => col.replace(/(^"|"$)/g, '').trim());
                
                // 假設 Google Sheet 的直行順序為： A:學校/單位 | B:職稱 | C:姓名
                if (cols.length >= 3) {
                    result.push({ school: cols[0], title: cols[1], name: cols[2] });
                } else if (cols.length === 2) {
                    result.push({ school: "縣府長官", title: cols[0], name: cols[1] });
                } else if (cols.length === 1) {
                    result.push({ school: "縣府長官", title: "", name: cols[0] });
                }
            }
            return result;
        } catch (error) {
            console.error("抓取資料失敗:", error);
            alert("讀取名單失敗，請確認網路連線或 CSV 網址是否正確。");
            return [];
        }
    }

    async function loadList(type) {
        // 先切換到名單畫面並顯示讀取中
        const listTitle = document.getElementById('list-title');
        const container = document.getElementById('name-list-container');
        container.innerHTML = "<p style='text-align:center;'>資料讀取中，請稍候...</p>";
        showScreen('screen-name-list');

        const isSchool = (type === 'school');
        const url = isSchool ? CSV_URL_SCHOOL : CSV_URL_GOV;
        listTitle.innerText = isSchool ? "請選擇您的姓名 (各級學校)" : "請選擇您的姓名 (長官/貴賓)";

        // 去抓取對應的 CSV 資料
        const data = await fetchCSV(url);
        renderNames(data, isSchool);
    }

    function renderNames(peopleList, isSchool) {
        const container = document.getElementById('name-list-container');
        container.innerHTML = "";
        
        // 🌟 自動排序邏輯：高中 ➔ 國中 ➔ 國小
        if (isSchool) {
            peopleList.sort((a, b) => {
                const getWeight = (schoolName) => {
                    if (!schoolName) return 4;
                    if (schoolName.includes('高中')) return 1;
                    if (schoolName.includes('國中')) return 2;
                    if (schoolName.includes('國小')) return 3;
                    return 4;
                };
                return getWeight(a.school) - getWeight(b.school);
            });
        }

        peopleList.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'btn-list';
            btn.innerText = isSchool ? `${p.school} - ${p.name} ${p.title}` : `${p.title} - ${p.name}`;
            
            if(isAlreadySigned(p)) {
                btn.classList.add('signed');
                btn.innerText += " (已簽到)";
                btn.onclick = () => alert("此位長官/校長已完成簽到囉！");
            } else {
                btn.onclick = () => {
                    currentPerson = p;
                    document.getElementById('current-name').innerText = isSchool ? 
                        `${p.school} ${p.name} ${p.title}` : 
                        `${p.title} ${p.name}`;
                    showScreen('screen-signature');
                };
            }
            container.appendChild(btn);
        });
    }

    // ==========================================
    // 6. 簽名板 (Canvas) 核心功能
    // ==========================================
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function initCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width; 
        canvas.height = 250;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 4; 
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000'; 
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', endDraw);

    function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        resetIdleTimer(60);
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function endDraw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        isDrawing = false;
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ==========================================
    // 7. 將資料寫入 Firebase
    // ==========================================
    function isCanvasBlank(canvas) {
        const blank = document.createElement('canvas');
        blank.width = canvas.width;
        blank.height = canvas.height;
        return canvas.toDataURL() === blank.toDataURL();
    }

    function submitSignature() {
        if (isCanvasBlank(canvas)) {
            alert("請先在白色區域簽名後再送出！");
            return;
        }

        const imgData = canvas.toDataURL('image/png');
        const timestamp = new Date().toISOString();

        const record = {
            name: currentPerson.name,
            title: currentPerson.title,
            school: currentPerson.school || "縣府長官",
            signature: imgData,
            time: timestamp
        };

        database.ref(DB_PATH).push(record)
            .then(() => {
                showScreen('screen-success');
                setTimeout(() => { showScreen('screen-home'); }, 3000);
            })
            .catch((error) => {
                console.error("寫入失敗：", error);
                alert("連線資料庫失敗，請檢查網路狀態！");
            });
    }
</script>
</body>
</html>
